[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-pipeline"
version = "1.0.0"
description = "Project 4 Part 1 - traffic accident data pipeline (STATS19 + Open-Meteo -> PostgreSQL/PostGIS)"
requires-python = ">=3.10"

[project.scripts]
traffic-pipeline = "traffic_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
